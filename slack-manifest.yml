display_information:
  name: Emperor
  description: L'assistant de Josué (GRO) pour vos questions sur votre système monday.
  background_color: "#4b2a85"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Emperor
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - users:read
settings:
  event_subscriptions:
    request_url: https://REMPLACER-PAR-TON-PROJET.vercel.app/api/slack/events
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
